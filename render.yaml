services:
  - type: web
    name: myai-data-analyzer
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: DATA_DIR
        value: /tmp/myai-data-analyzer
      - key: MAX_UPLOAD_MB
        value: 100
      - key: MYAI_API_URL
        value: https://myspace-rzni.onrender.com/api/ai
