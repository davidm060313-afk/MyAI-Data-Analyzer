services:
  - type: web
    name: myai-data-analyzer
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: DATA_DIR
        value: /var/data
      - key: MAX_UPLOAD_MB
        value: 100
      - key: DATABASE_URL
        sync: false
      - key: MYAI_API_URL
        sync: false
      - key: MYAI_API_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
    disk:
      name: analyzer-files
      mountPath: /var/data
      sizeGB: 10
