<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}MyAI Data Analyzer{% endblock %}</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body><header><a class="brand" href="{{ url_for('index') }}">◈ MyAI Data Analyzer</a><span class="tag">Private workspace · AI-assisted</span></header>
<main>{% with messages = get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="notice {{ category }}">{{ message }}</div>{% endfor %}{% endwith %}{% block content %}{% endblock %}</main>
<footer>AI can make mistakes. Review important findings before acting on them.</footer></body></html>
